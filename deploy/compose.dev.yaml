# The dev stack (plan S1).
#
#   docker compose -f deploy/compose.dev.yaml up -d --build
#   docker compose -f deploy/compose.dev.yaml run --rm seed
#   docker compose -f deploy/compose.dev.yaml run --rm -e JARVIS_HARNESS=fake runner
#
# Everything lives in a named volume mounted at /var/lib/jarvis inside the
# containers, so the host needs no root-owned directory and Windows is fine.
# JARVIS_ROOT is set explicitly anyway: the point of S1 is that the path is
# configuration, not a constant.
name: jarvis-dev

x-app: &app
  build:
    context: ..
    dockerfile: deploy/Dockerfile.dev
  environment: &app-env
    DATABASE_URL: postgres://jarvis:dev@postgres:5432/jarvis
    JARVIS_ROOT: /var/lib/jarvis
    JARVIS_DEV: "1"
    MIGRATIONS_DIR: /app/migrations
    MASTER_KEY_PATH: /var/lib/jarvis/keys/master.key
    LOGIN_ONCE_PATH: /var/lib/jarvis/keys/login-once.txt
    JARVIS_OPERATOR_EMAIL: dev@jarvis.local
    JARVIS_ORIGIN: http://localhost:8080
  volumes:
    - jarvis_root:/var/lib/jarvis
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: jarvis
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: jarvis
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jarvis -d jarvis"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data

  api:
    <<: *app
    environment:
      <<: *app-env
      HOST: 0.0.0.0
      PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"

  # One-shot. `run --rm seed` resets the database and the throwaway repo.
  seed:
    <<: *app
    profiles: ["tools"]
    command: ["node", "--import", "tsx", "scripts/dev-seed.ts"]

  # One-shot by default so a test can run a single variant and read the result.
  # JARVIS_HARNESS picks the variant: fake, fake:crash, fake:slow, fake:runaway,
  # fake:noop, fake:escape.
  runner:
    <<: *app
    profiles: ["tools"]
    command: ["node", "dist/runner.js"]
    environment:
      <<: *app-env
      RUNNER_ID: dev-heavy-1
      JARVIS_HARNESS: fake

volumes:
  jarvis_root:
