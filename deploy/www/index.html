<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jarvis</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f1ea;
        --ink: #1c1917;
        --muted: #57534e;
        --line: #d6d3d1;
        --card: #fffcf7;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
        background: var(--bg);
        color: var(--ink);
        display: grid;
        place-items: center;
        padding: 2rem;
      }
      main {
        width: min(40rem, 100%);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 1rem;
        padding: 2rem 2.25rem;
      }
      h1 {
        margin: 0 0 0.35rem;
        font-size: 1.75rem;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0.75rem 0 0;
        color: var(--muted);
        line-height: 1.5;
      }
      code {
        font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
        font-size: 0.9em;
        color: var(--ink);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Jarvis</h1>
      <p>Control Center is not built yet. TLS and the host are up. Phase 0 placeholder for <code>jarvis.enriquecodes.com</code>.</p>
      <p><code>/api/health</code> should return JSON from this origin.</p>
    </main>
  </body>
</html>
